<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MatSmart AI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 500px;
      background: #111827;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 10px;
      border: none;
      outline: none;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #22c55e;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    .result {
      margin-top: 20px;
      padding: 10px;
      background: #1f2937;
      border-radius: 10px;
      min-height: 50px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>MatSmart AI 🍽️</h1>

    <input id="budget" placeholder="Skriv budsjett (f.eks 100 kr)" />
    <input id="idea" placeholder="Hva vil du spise? (valgfritt)" />

    <button onclick="getMeal()">Få middag</button>

    <div class="result" id="result">
      Resultat vises her...
    </div>
  </div>

  <script>
    function getMeal() {
      const budget = document.getElementById("budget").value;
      const idea = document.getElementById("idea").value;

      document.getElementById("result").innerHTML =
        "⏳ Lager forslag basert på " + budget + " kr...";
    }
  </script>
</body>
</html>
